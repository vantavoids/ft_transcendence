services:
  frontend:
    container_name: frontend
    image: frontend
    pull_policy: never
    # no host port: reached only through nginx over the unix socket below.
    build:
      context: ${PWD}/frontend
      dockerfile: Dockerfile
    env_file: ${PWD}/frontend/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Next.js can't listen on a unix socket, so this bridges nginx's socket to the
  # frontend's TCP port; the frontend itself has no host-published port (HTTPS-only).
  frontend-socket:
    container_name: frontend-socket
    image: docker.io/alpine/socat
    command: UNIX-LISTEN:/run/frontend/frontend.sock,fork,mode=0666 TCP:frontend:3000
    volumes:
      - frontend_socket:/run/frontend:z
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  frontend_socket:
