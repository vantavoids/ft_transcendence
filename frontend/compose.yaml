services:
  frontend:
    container_name: frontend
    image: frontend
    pull_policy: never
    # published on loopback only so host-net nginx can proxy it at / ; not
    # reachable off-host (nginx is the sole LAN-facing ingress).
    ports:
      - "127.0.0.1:3000:3000"
    build:
      context: ${PWD}/frontend
      dockerfile: Dockerfile
    env_file: ${PWD}/frontend/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
