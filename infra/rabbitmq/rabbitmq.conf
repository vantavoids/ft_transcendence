deprecated_features.permit.management_metrics_collection = true

# expose per-queue/per-channel labels on /metrics (off by default, which only
# gives aggregated totals). cheap at our handful of queues, and it's what lets
# the RabbitMQ dashboard break down depth per queue and surface *_skipped /
# *_error queues (the MassTransit URN-binding failure mode).
prometheus.return_per_object_metrics = true
