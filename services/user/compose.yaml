services:
  user-db:
    container_name: user-db
    image: docker.io/postgres:17-alpine
    env_file: ${PWD}/services/user/.env
    volumes:
      - user_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  user:
    container_name: user
    image: user-service
    pull_policy: never
    build:
      context: ${PWD}/services/user
      dockerfile: Dockerfile
    env_file: ${PWD}/services/user/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      BASE_URL: ${BASE_URL}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_USER_BUCKET: ${MINIO_USER_BUCKET}
      MINIO_EXPORTS_BUCKET: ${MINIO_EXPORTS_BUCKET}
      AUTH_INTERNAL_URL: ${AUTH_INTERNAL_URL}
      GUILD_INTERNAL_URL: ${GUILD_INTERNAL_URL}
      CHAT_INTERNAL_URL: ${CHAT_INTERNAL_URL}
      NOTIFICATION_INTERNAL_URL: ${NOTIFICATION_INTERNAL_URL}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
    depends_on:
      user-db:
        condition: service_healthy

volumes:
  user_db_data:
