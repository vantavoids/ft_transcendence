services:
  user-db:
    container_name: user-db
    build:
      context: ${PWD}
      dockerfile: services/user/Dockerfile.db
    env_file: ${PWD}/services/user/.env
    volumes:
      - user_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  user:
    container_name: user
    image: user-service
    pull_policy: never
    build:
      context: ${PWD}/services/user
      dockerfile: Dockerfile
    env_file: ${PWD}/services/user/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/hello-world"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      rabbitmq:
        condition: service_healthy
      user-db:
        condition: service_healthy

volumes:
  user_db_data:
