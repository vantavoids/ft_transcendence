services:
  gateway:
    container_name: gateway
    image: gateway-service
    pull_policy: never
    build:
      context: ${PWD}/services/gateway
      dockerfile: Dockerfile
    # API over a unix socket shared with nginx, no TCP; :9090 is bridge-only for Prometheus.
    expose:
      - "9090"
    volumes:
      - gateway_socket:/run/gateway:z
    env_file: ${PWD}/services/gateway/.env
    environment:
      JWT_SECRET: ${JWT_SECRET}
      GATEWAY_SOCKET: /run/gateway/gateway.sock
      GATEWAY_METRICS_PORT: "9090"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9090/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      auth:
        condition: service_healthy
      chat:
        condition: service_healthy
      guild:
        condition: service_healthy
      notification:
        condition: service_healthy
      user:
        condition: service_healthy

volumes:
  gateway_socket:

