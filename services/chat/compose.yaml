services:
  chat-db:
    container_name: chat-db
    image: docker.io/scylladb/scylla:6.2
    volumes:
      - chat_db_data:/var/lib/scylla
    healthcheck:
      test: ["CMD", "cqlsh", "--execute", "SELECT now() FROM system.local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  chat-migrate:
    container_name: chat-migrate
    profiles: ["migrate"]
    image: docker.io/scylladb/scylla:6.2
    entrypoint: ["sh", "/schema/apply.sh"]
    volumes:
      - ${PWD}/services/chat/schema:/schema:ro,z
    depends_on:
      chat-db:
        condition: service_healthy

  chat:
    container_name: chat
    image: chat-service
    pull_policy: never
    build:
      context: ${PWD}/services/chat
      dockerfile: Dockerfile
    env_file: ${PWD}/services/chat/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    environment:
      RabbitMQ__Host: rabbitmq
      RabbitMQ__VirtualHost: /
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASS}
      BackendConfiguration__BaseUrl: ${BASE_URL}
      BackendConfiguration__BaseApiUrl: ${BASE_API_URL}
      Services__GuildService: http://guild:8080
      Jwt__SecretKey: ${JWT_SECRET}
      Minio__Endpoint: http://minio:9000
      Minio__AccessKey: ${MINIO_ACCESS_KEY}
      Minio__SecretKey: ${MINIO_SECRET_KEY}
      Minio__Bucket: ${MINIO_BUCKET}
    depends_on:
      rabbitmq:
        condition: service_healthy
      chat-db:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  chat_db_data:
