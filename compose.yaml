include:
  - frontend/compose.yaml
  - services/auth/compose.yaml
  - services/chat/compose.yaml
  - services/gateway/compose.yaml
  - services/guild/compose.yaml
  - services/notification/compose.yaml
  - services/user/compose.yaml
  - infra/monitoring/compose.yaml

services:
  nginx:
    container_name: nginx
    image: docker.io/nginx:alpine
    # sole LAN-facing ingress; host networking so it sees the real client IP for
    # the gateway rate limiter. App backends (gateway, frontend) are reached over
    # unix sockets, not host ports; only admin UIs stay on 127.0.0.1 loopback.
    network_mode: host
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro,z
      - ./certs:/etc/nginx/certs:ro,z
      - gateway_socket:/run/gateway:z
      - frontend_socket:/run/frontend:z
    depends_on:
      gateway:
        condition: service_healthy
      frontend:
        condition: service_healthy
      frontend-socket:
        condition: service_started

  rabbitmq:
    container_name: rabbitmq
    image: docker.io/rabbitmq:management-alpine
    user: "100:101"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    # AMQP (5672) and metrics (15692) stay internal (reached by service name over
    # the compose network). Only the management UI is published, on loopback, so
    # host-net nginx can proxy it at /rabbitmq; it is not reachable off-host.
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro,z
      # enables rabbitmq_prometheus, which serves metrics on :15692
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro,z
      - rabbitmq_data:/var/lib/rabbitmq:z
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  coturn:
    container_name: coturn
    image: docker.io/coturn/coturn:alpine
    # the image runs as 'nobody', which cannot read the 0600 TLS private key in
    # ./certs; run as root to read it (same effective access as nginx's root
    # master process). without this the 5349 TLS/DTLS listener fails to start.
    user: "0:0"
    # host networking so the UDP relay port range and 3478/5349 are reachable
    # without publishing a large port span (same approach as nginx)
    network_mode: host
    # entrypoint pins the relay/external IP to one reachable IPv4 (see
    # infra/coturn/entrypoint.sh); realm + user come from the environment.
    entrypoint: ["/usr/local/bin/coturn-entrypoint.sh"]
    environment:
      TURN_REALM: ${TURN_REALM}
      TURN_USERNAME: ${TURN_USERNAME}
      TURN_PASSWORD: ${TURN_PASSWORD}
      # optional: force the advertised relay IP; empty => auto-detect the LAN IP
      TURN_RELAY_IP: ${TURN_RELAY_IP:-}
    volumes:
      - ./infra/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro,z
      - ./infra/coturn/entrypoint.sh:/usr/local/bin/coturn-entrypoint.sh:ro,z
      - ./certs:/etc/coturn/certs:ro,z
    restart: unless-stopped

  minio:
    container_name: minio
    image: docker.io/minio/minio
    entrypoint: ["sh", "/usr/local/bin/minio-entrypoint.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_USER_BUCKET: ${MINIO_USER_BUCKET}
      MINIO_GUILD_BUCKET: ${MINIO_GUILD_BUCKET}
      MINIO_EXPORTS_BUCKET: ${MINIO_EXPORTS_BUCKET}
      # lets Prometheus scrape /minio/v2/metrics/* without a bearer token
      MINIO_PROMETHEUS_AUTH_TYPE: public
      # console is exposed only through nginx over HTTPS at /minio; this points the
      # console at that base (BASE_URL = the host clients actually hit, which on a
      # multi-machine LAN is not localhost) so its assets and redirects resolve.
      MINIO_BROWSER_REDIRECT_URL: ${BASE_URL}/minio
    # console (9001) and S3 API (9000) published on loopback only, so host-net
    # nginx can proxy them (/minio and /s3); not reachable off-host. Internal
    # services still reach the API by service name (minio:9000) over the network.
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
      - ./infra/minio/entrypoint.sh:/usr/local/bin/minio-entrypoint.sh:ro,z
    healthcheck:
      test: ["CMD", "sh", "-c", "mc ready local && mc stat local/$$MINIO_BUCKET local/$$MINIO_USER_BUCKET local/$$MINIO_GUILD_BUCKET local/$$MINIO_EXPORTS_BUCKET >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mailhog:
    container_name: mailhog
    image: docker.io/mailhog/mailhog:v1.0.1
    environment:
      MH_UI_WEB_PATH: mailhog
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8025/mailhog/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rabbitmq_data:
  minio_data:
  gateway_socket:
