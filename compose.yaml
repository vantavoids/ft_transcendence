include:
  - frontend/compose.yaml
  - services/auth/compose.yaml
  - services/chat/compose.yaml
  - services/gateway/compose.yaml
  - services/guild/compose.yaml
  - services/notification/compose.yaml
  - services/user/compose.yaml

services:
  nginx:
    container_name: nginx
    image: docker.io/nginx:alpine
    network_mode: host
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro,z
      - ./certs:/etc/nginx/certs:ro,z
      # WebRTC signaling test harness (tmp/webrtc-test-harness branch only)
      - ./services/chat/tools/webrtc-test:/usr/share/nginx/webrtc:ro,z
    depends_on:
      gateway:
        condition: service_healthy
      frontend:
        condition: service_healthy

  rabbitmq:
    container_name: rabbitmq
    image: docker.io/rabbitmq:management-alpine
    user: "100:101"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro,z
      - rabbitmq_data:/var/lib/rabbitmq:z
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  coturn:
    container_name: coturn
    image: docker.io/coturn/coturn:alpine
    # the image runs as 'nobody', which cannot read the 0600 TLS private key in
    # ./certs; run as root to read it (same effective access as nginx's root
    # master process). without this the 5349 TLS/DTLS listener fails to start.
    user: "0:0"
    # host networking so the UDP relay port range and 3478/5349 are reachable
    # without publishing a large port span (same approach as nginx)
    network_mode: host
    # entrypoint pins the relay/external IP to one reachable IPv4 (see
    # infra/coturn/entrypoint.sh); realm + user come from the environment.
    entrypoint: ["/usr/local/bin/coturn-entrypoint.sh"]
    environment:
      TURN_REALM: ${TURN_REALM}
      TURN_USERNAME: ${TURN_USERNAME}
      TURN_PASSWORD: ${TURN_PASSWORD}
      # optional: force the advertised relay IP; empty => auto-detect the LAN IP
      TURN_RELAY_IP: ${TURN_RELAY_IP:-}
    volumes:
      - ./infra/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro,z
      - ./infra/coturn/entrypoint.sh:/usr/local/bin/coturn-entrypoint.sh:ro,z
      - ./certs:/etc/coturn/certs:ro,z
    restart: unless-stopped

  minio:
    container_name: minio
    image: docker.io/minio/minio
    entrypoint: ["sh", "/usr/local/bin/minio-entrypoint.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_USER_BUCKET: ${MINIO_USER_BUCKET}
      MINIO_GUILD_BUCKET: ${MINIO_GUILD_BUCKET}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
      - ./infra/minio/entrypoint.sh:/usr/local/bin/minio-entrypoint.sh:ro,z
    healthcheck:
      test: ["CMD", "sh", "-c", "mc ready local && mc stat local/$$MINIO_BUCKET local/$$MINIO_USER_BUCKET local/$$MINIO_GUILD_BUCKET >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  rabbitmq_data:
  minio_data:
